version: 2

models:
  - name: movie_language_bridge
    description: "A bridge model linking movies to their spoken languages, establishing a many-to-many relationship."
    columns:
      - name: movie_id
        description: "Foreign key to the movies table."
        tests:
          - not_null

      - name: language_code
        description: "Foreign key to the dim_languages table (using the ISO 639-1 code)."
        tests:
          - not_null
          
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - movie_id
            - language_code