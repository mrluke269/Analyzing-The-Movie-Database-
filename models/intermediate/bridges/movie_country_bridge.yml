version: 2

models:
  - name: movie_country_bridge
    description: "A bridge model that links movies to their production countries, creating a many-to-many relationship."
    columns:
      - name: movie_id
        description: "Foreign key to the movies table."
        tests:
          - not_null

      - name: country_code
        description: "Foreign key to the dim_countries table (using the ISO 3166-1 code)."
        tests:
          - not_null
          
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - movie_id
            - country_code