version: 2

models:
  - name: revenue_by_genre
    description: "An analytical model that aggregates key financial and rating metrics by movie genre. Each row represents a single genre."
    columns:
      - name: genre_id
        description: "The name of the movie genre. This is the primary key for this model."
        tests:
          - unique
          - not_null

      - name: total_revenue
        description: "The total gross revenue generated by all movies within the genre."


      - name: total_movies
        description: "The total count of unique movies categorized under this genre."


      - name: avg_revenue_per_movie
        description: "The average revenue generated per movie within the genre."

      - name: total_profit
        description: "The total profit (revenue minus budget) generated by all movies within the genre."

      - name: avg_rating
        description: "The average user rating for movies within the genre."