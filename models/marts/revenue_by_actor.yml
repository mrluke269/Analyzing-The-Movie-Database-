version: 2

models:
  - name: revenue_by_actor
    description: "An analytical model that aggregates key financial and rating metrics by actor. Each row represents a single actor."
    columns:
      - name: actor_id
        description: "The name of the actor. This is the primary key for this model."
        tests:
          - unique
          - not_null

      - name: total_revenue
        description: "The total gross revenue generated by all movies the actor has appeared in."


      - name: total_movies
        description: "The total count of unique movies the actor has appeared in."


      - name: avg_revenue_per_movie
        description: "The average revenue generated per movie the actor has appeared in."

      - name: total_profit
        description: "The total profit (revenue minus budget) generated by all movies the actor has appeared in."

      - name: avg_rating
        description: "The average user rating for movies the actor has appeared in."